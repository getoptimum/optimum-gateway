syntax = "proto3";

package getoptimum.optimum_gateway.service.telemetry.v1;

option go_package = "github.com/getoptimum/optimum-gateway/pkg/service/telemetry/remotepb";

// WriteRequest contains the time series payload sent through remote write.
message WriteRequest {
  repeated TimeSeries timeseries = 1;
}

// TimeSeries contains labels and samples for one metric series.
message TimeSeries {
  repeated Label labels = 1;
  repeated Sample samples = 2;
}

// Label identifies one dimension of a time series.
message Label {
  string name = 1;
  string value = 2;
}

// Sample records a metric value at a millisecond timestamp.
message Sample {
  double value = 1;
  int64 timestamp = 2;
}
