# gosec Configuration and Exceptions
# This file documents code security rules that are excluded from gosec scanning
# Each exception should have a clear justification for why it's acceptable

excluded_rules:
  - rule: G108
    title: Profiling endpoint automatically exposed on /debug/pprof
    severity: HIGH
    cwe: CWE-200 (Information Exposure)
    reason: |
      The pprof profiling endpoints are intentionally enabled for performance
      monitoring and debugging in production. Access is controlled through:
      - Network-level restrictions (firewalls, not exposed to public internet)
      - Internal admin port separate from user-facing API services
      - Used by operations team for troubleshooting and performance analysis
      - Gateway metrics and profiling data aids in capacity planning
      This is a standard practice for Go services requiring production diagnostics.
    mitigation: Ensure pprof runs on separate admin port with network restrictions
    review_date: "2026-01-12"
    status: accepted

  - rule: G115
    title: Integer overflow conversion
    severity: MEDIUM
    cwe: CWE-190 (Integer Overflow or Wraparound)
    reason: |
      G115 flags potential integer overflow/underflow during type conversions.
      Many flagged instances are false positives where:
      - Values are within known safe ranges (e.g., array lengths, counts)
      - Input validation ensures no overflow is possible
      - Conversions are between compatible safe types
      - Protocol buffers and gRPC use specific integer types requiring conversion
      This rule generates excessive noise. We rely on:
      - Code review for critical numeric conversions
      - Explicit bounds checking where needed
      - Go's safe integer behavior (panic on overflow in many cases)
      - Integration tests covering edge cases
    review_date: "2026-01-12"
    status: accepted

scan_configuration:
  severity_threshold:
    value: high
    reason: |
      Only fail on HIGH severity issues to reduce noise and focus on
      critical security vulnerabilities. MEDIUM and LOW severity issues
      are still visible in scan output for awareness but don't block CI.
  exclude_generated:
    value: true
    reason: Generated code (protobuf, gRPC stubs, etc.) should be excluded from security scanning
