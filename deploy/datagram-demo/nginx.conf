# Config proxy. Serves dynamic-config.json verbatim on the gateway's
# DynamicConfig path and forwards everything else to the mock bootstrap.
#
# Why a proxy rather than teaching the mock to serve the config: the config is
# the one part of the run an operator is expected to edit, so it stays a
# committed JSON file that is diffable on its own, and nginx serves the exact
# bytes rather than a re-encoding of them.
#
# Auth deliberately does NOT go through here. The gateway pins the JWT issuer to
# OPT_REMOTE_AUTH_URL and the mock mints iss=http://bootstrap:48124, so the
# gateway must reach the mint and JWKS endpoints under that exact origin.
events {}

http {
  # `bootstrap` is resolved once at startup; compose brings that service up
  # first, so the name is already in DNS when nginx parses this.
  server {
    listen 48124;

    # The gateway fetches /api/v1/<chain>/<cluster>/config?service_version=...
    # The regex also covers /api/v2/ so this keeps working if the config client
    # moves version the way register/expose already did.
    location ~ "^/api/v[12]/[^/]+/[^/]+/config$" {
      default_type application/json;
      root /srv;
      rewrite ^ /dynamic-config.json break;
    }

    location / {
      proxy_pass http://bootstrap:48124;
      proxy_set_header Host $host;
    }
  }
}
