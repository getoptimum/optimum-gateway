# Config proxy. Serves the generated served-config.json verbatim on the
# gateway's DynamicConfig path and forwards everything else to the mock
# bootstrap.
#
# The served document is generated rather than committed because the tier
# varies k, the publisher multiplier, the forwarding threshold and the mesh
# degree from run to run; dynamic-config.json holds the base values and
# gen-stack.py writes served-config.json from it.
#
# Auth deliberately does NOT go through here. The gateway pins the JWT issuer to
# OPT_REMOTE_AUTH_URL and the mock mints iss=http://bootstrap:48124, so the
# gateway must reach the mint and JWKS endpoints under that exact origin.
events {}

http {
  # `bootstrap` is resolved once at startup; compose brings that service up
  # first, so the name is already in DNS when nginx parses this.
  server {
    listen 48124;

    location ~ "^/api/v[12]/[^/]+/[^/]+/config$" {
      default_type application/json;
      root /srv;
      rewrite ^ /served-config.json break;
    }

    location / {
      proxy_pass http://bootstrap:48124;
      proxy_set_header Host $host;
    }
  }
}
